<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navAdmin('productos')}"></nav>

<main class="container my-4">
    <h2 class="fw-bold mb-4">Productos</h2>
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <button type="button" class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalForm"><i class="bi bi-plus-circle"></i> Nuevo</button>

    <div class="modal fade" id="modalForm" tabindex="-1" th:attr="data-volver=@{/admin/productos}">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" th:text="${producto.id == 0} ? 'Nuevo producto' : 'Editar producto'">Editar</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Precio (S/)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Stock</label>
                        <input type="number" class="form-control" th:field="*{stock}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Categoría</label>
                        <select class="form-select" name="categoriaId" required>
                            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                                    th:selected="${producto.categoria != null and producto.categoria.id == c.id}">Categoría</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Imagen (archivo en /img)</label>
                        <input type="text" class="form-control" th:field="*{imagen}" placeholder="rosasRojas.jpg">
                    </div>
                </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${productos}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.nombre}">Nombre</td>
            <td th:text="${p.categoria.nombre}">Categoría</td>
            <td th:text="${@datos.soles(p.precio)}">S/ 0.00</td>
            <td><span class="badge" th:classappend="${p.stock < 5} ? 'bg-danger' : 'bg-success'" th:text="${p.stock}">0</span></td>
            <td>
                <a th:href="@{/admin/productos(editar=${p.id})}" class="btn btn-sm btn-primary"><i class="bi bi-pencil"></i></a>
                <form th:action="@{/admin/productos/eliminar/{id}(id=${p.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar producto?')"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:if="${producto.id != 0}">
    var modal = document.getElementById('modalForm');
    new bootstrap.Modal(modal).show();
    modal.addEventListener('hidden.bs.modal', function () { window.location = modal.dataset.volver; });
</script>
</body>
</html>

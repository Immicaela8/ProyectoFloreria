<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Promociones')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navAdmin('promociones')}"></nav>

<main class="container my-4">
    <h2 class="fw-bold mb-4">Promociones</h2>
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <button type="button" class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalForm"><i class="bi bi-plus-circle"></i> Nuevo</button>

    <div class="modal fade" id="modalForm" tabindex="-1" th:attr="data-volver=@{/admin/promociones}">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/promociones/guardar}" th:object="${promocion}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" th:text="${promocion.id == 0} ? 'Nuevo promoción' : 'Editar promoción'">Editar</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Producto</label>
                        <select class="form-select" name="productoId" required>
                            <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}"
                                    th:selected="${promocion.producto != null and promocion.producto.id == p.id}">Producto</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descuento (%)</label>
                        <input type="number" min="1" max="90" class="form-control" th:field="*{porcentaje}" required>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" th:field="*{activa}">
                            <label class="form-check-label" for="activa1">Promoción activa</label>
                        </div>
                    </div>
                </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <table class="table table-striped align-middle">
        <thead class="table-dark">
        <tr><th>ID</th><th>Producto</th><th>Descuento</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="pr : ${promociones}">
            <td th:text="${pr.id}">1</td>
            <td th:text="${pr.producto.nombre}">Producto</td>
            <td th:text="${pr.porcentaje} + '%'">10%</td>
            <td><span class="badge" th:classappend="${pr.activa} ? 'bg-success' : 'bg-secondary'" th:text="${pr.activa} ? 'Activa' : 'Inactiva'">Estado</span></td>
            <td>
                <a th:href="@{/admin/promociones(editar=${pr.id})}" class="btn btn-sm btn-primary"><i class="bi bi-pencil"></i></a>
                <form th:action="@{/admin/promociones/eliminar/{id}(id=${pr.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar promoción?')"><i class="bi bi-trash"></i></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:if="${promocion.id != 0}">
    var modal = document.getElementById('modalForm');
    new bootstrap.Modal(modal).show();
    modal.addEventListener('hidden.bs.modal', function () { window.location = modal.dataset.volver; });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navComprador('productos')}"></nav>

<div class="container text-center my-5">
    <h1 class="fw-bold">Catálogo de Productos 🌸</h1>
    <p class="lead">Explora nuestra selección de flores y arreglos especiales.</p>
</div>

<div class="container">
    <ul class="nav nav-tabs">
        <li class="nav-item" th:each="c, it : ${categorias}">
            <button type="button" class="nav-link" th:classappend="${it.first} ? 'active'"
                    data-bs-toggle="tab" th:attr="data-bs-target='#cat' + ${c.id}" th:text="${c.nombre}">Categoría</button>
        </li>
    </ul>

    <div class="tab-content mt-4">
        <div class="tab-pane fade" th:each="c, it : ${categorias}" th:id="'cat' + ${c.id}"
             th:classappend="${it.first} ? 'show active'">
            <div class="row g-4">
                <div class="col-md-3" th:each="p : ${productos}" th:if="${p.categoria.id == c.id}">
                    <div class="card shadow-sm h-100">
                        <div class="ratio ratio-1x1">
                            <img th:src="@{'/img/' + ${p.imagen}}" class="w-100 d-block" th:alt="${p.nombre}">
                        </div>
                        <div class="card-body text-center">
                            <h5 class="card-title" th:text="${p.nombre}">Producto</h5>
                            <p class="card-text">
                                <span th:if="${@datos.promoActiva(p.id) != null}">
                                    <span class="text-muted text-decoration-line-through" th:text="${@datos.soles(p.precio)}"></span>
                                    <span class="fw-bold text-danger" th:text="${@datos.soles(@datos.precioFinal(p))}"></span>
                                </span>
                                <span th:if="${@datos.promoActiva(p.id) == null}" th:text="${@datos.soles(p.precio)}"></span>
                            </p>
                            <p class="small text-muted" th:text="'Stock: ' + ${p.stock}">Stock</p>
                            <a th:href="@{/comprar(producto=${p.id})}" class="btn btn-success"
                               th:classappend="${p.stock == 0} ? 'disabled'"><i class="bi bi-cart"></i> Comprar</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
